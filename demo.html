<!doctype html>
<html lang="kk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>№7 жұмыс — API қауіпсіздігін тексеру</title>
<style>
body{font:17px/1.5 system-ui,sans-serif;max-width:880px;margin:36px auto;padding:0 20px;color:#17202a;background:#f5f7fa}
h1{font-size:28px;margin-bottom:8px}p{margin:8px 0 20px}section{background:white;padding:20px;margin:16px 0;border:1px solid #d7dee7;border-radius:8px}
label{display:inline-block;margin:4px 12px 12px 0}input{display:block;padding:8px;font:inherit;max-width:240px;border:1px solid #aeb9c5;border-radius:4px}
button{font:inherit;padding:9px 14px;background:#154e8a;color:white;border:0;border-radius:4px;cursor:pointer;margin-right:10px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.5 Consolas,monospace;background:#101b2a;color:#e8f0fa;padding:18px;border-radius:6px}
#status{font-weight:700}a{color:#154e8a}
</style>
<h1>API қауіпсіздігі мен күйін тексеру</h1>
<p>№7 практикалық жұмыс · 10-нұсқа. Қызмет пен база бөлек тексеріледі.</p>
<section>
<button id="health">Қызмет күйі</button>
<button id="database">База күйі</button>
<button id="bad">400 тексеру</button>
<button id="missing">404 тексеру</button>
</section>
<section>
<button id="all">Барлық файлды оқу</button>
<label>Файл нөмірі<input id="file-id" type="number" value="1" min="1"></label>
<button id="one">Бір файлды оқу</button>
</section>
<section>
<h2>Жаңа файл қосу</h2>
<label>Атауы<input id="name" value="зертхана.txt"></label>
<label>MIME түрі<input id="type" value="text/plain"></label>
<label>Көлемі, байт<input id="size" type="number" value="2048" min="0"></label>
<button id="add">POST арқылы қосу</button>
</section>
<section aria-live="polite">
<p id="request">Сұраныс әлі жіберілген жоқ.</p>
<p id="status">Нәтижені көру үшін батырманы басыңыз.</p>
<pre id="result">{}</pre>
</section>
<p><a href="/api/files">JSON тізімін ашу</a> · <a href="/info">Құпиясыз баптау белгісі</a></p>
<script>
async function send(method,path,data){
  document.getElementById('request').textContent=method+' '+path;
  document.getElementById('status').textContent='Сұраныс орындалып жатыр…';
  try{
    const options={method};
    if(data){options.headers={'Content-Type':'application/json'};options.body=JSON.stringify(data);}
    const response=await fetch(path,options);
    const body=await response.json();
    document.getElementById('status').textContent='HTTP '+response.status+' '+(response.ok?'— сәтті орындалды':'— сұраныс орындалмады');
    document.getElementById('result').textContent=JSON.stringify(body,null,2);
  }catch(error){document.getElementById('status').textContent='Серверге қосылу мүмкін болмады';}
}
document.getElementById('all').onclick=()=>send('GET','/api/files');
document.getElementById('one').onclick=()=>send('GET','/api/files/'+encodeURIComponent(document.getElementById('file-id').value));
document.getElementById('health').onclick=()=>send('GET','/health');
document.getElementById('database').onclick=()=>send('GET','/health/db');
document.getElementById('bad').onclick=()=>send('POST','/api/files',{name:'тексеру.txt'});
document.getElementById('missing').onclick=()=>send('GET','/api/files/2147483647');
document.getElementById('name').value='файл-'+Date.now()+'.txt';
document.getElementById('add').onclick=()=>send('POST','/api/files',{
  name:document.getElementById('name').value,
  content_type:document.getElementById('type').value,
  size_bytes:Number(document.getElementById('size').value)
});
</script>
</html>
